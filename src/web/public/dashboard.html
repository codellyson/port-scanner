<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Scanner Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="nameplate">
        <h1>Port Scanner</h1>
        <span id="platform" class="plate">-</span>
      </div>
      <div class="header-actions">
        <div id="connStatus" class="conn-status" data-state="connecting" role="status" aria-live="polite">
          <span class="conn-dot" aria-hidden="true"></span>
          <span id="connLabel">Connecting...</span>
          <span id="lastUpdate" class="conn-updated"></span>
        </div>
        <button id="refreshBtn" class="btn" title="Ports refresh automatically every 5s">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: -2px;">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
          Refresh
        </button>
      </div>
    </header>

    <div id="edgeNotice" class="edge-notice" role="status" style="display:none"></div>

    <section id="tunnelsSection" class="tunnels-section" style="display:none">
      <div class="tunnels-header">
        <h2>Active tunnels <span id="tunnelsCount" class="tunnels-count"></span></h2>
      </div>
      <div id="tunnelsList" class="tunnels-list"></div>
    </section>

    <div class="filters">
      <input type="text" id="searchInput" autofocus placeholder="Search ports, processes, addresses...  (press /)">
      <select id="protocolFilter">
        <option value="">All Protocols</option>
        <option value="tcp" selected>TCP</option>
        <option value="udp">UDP</option>
      </select>
      <select id="stateFilter">
        <option value="">All States</option>
        <option value="LISTEN" selected>Listening</option>
        <option value="ESTABLISHED">Established</option>
        <option value="TIME_WAIT">Time Wait</option>
        <option value="CLOSE_WAIT">Close Wait</option>
      </select>
      <button id="showAllBtn" class="btn" title="Clear filters and show every socket">Show all</button>
    </div>

    <div class="table-container">
      <table id="portsTable">
        <thead>
          <tr>
            <th data-sort="port">Port <span class="sort-icon"></span></th>
            <th data-sort="protocol">Protocol <span class="sort-icon"></span></th>
            <th data-sort="state">State <span class="sort-icon"></span></th>
            <th data-sort="pid">PID <span class="sort-icon"></span></th>
            <th data-sort="process">Process <span class="sort-icon"></span></th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="portsBody">
          <tr>
            <td colspan="6" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Logs Panel -->
  <div id="logsPanel" class="logs-panel">
    <div class="logs-header">
      <span id="logsTitle">Request Logs</span>
      <div class="logs-actions">
        <button class="btn" onclick="clearLogs()">Clear</button>
        <button class="btn" onclick="closeLogs()">Close</button>
      </div>
    </div>
    <div id="logsList" class="logs-list">
      <div class="logs-empty">No requests yet. Send a request to the tunnel URL to see it here.</div>
    </div>
  </div>

  <div id="confirmSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="sheet-panel">
      <p class="plate" id="confirmKicker">Confirm</p>
      <h2 class="sheet-title" id="confirmTitle"></h2>
      <p class="sheet-body" id="confirmBody"></p>
      <div class="sheet-actions">
        <button class="btn" type="button" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" type="button" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">
    <span id="toastMessage"></span>
    <button id="toastClose" class="toast-close" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
